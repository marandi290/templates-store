<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrics Counter</title>
  <link rel="stylesheet" href="styles.min.css?v=1.0.0" />
</head>
<body>
  <!-- ═══ COPY FROM HERE ═══════════════════════════════════ -->
  <section class="metrics-section">
    <div class="container">
      <div class="section-header">
        <span class="section-label">Business impact</span>
        <h2>Numbers that prove the value</h2>
        <p>Key metrics that show how teams accelerate their growth, productivity, and engagement.</p>
      </div>
      <div class="metrics-grid">
        <div class="metric-card"><div class="metric-value">4.9<span class="metric-label">★</span></div><div class="metric-label">Average platform rating</div></div>
        <div class="metric-card"><div class="metric-value">98%</div><div class="metric-label">Customer retention</div></div>
        <div class="metric-card"><div class="metric-value">12K</div><div class="metric-label">Active daily users</div></div>
        <div class="metric-card"><div class="metric-value">3.5x</div><div class="metric-label">Faster time to market</div></div>
      </div>
    </div>
  </section>
  <!-- ═══ COPY TO HERE ════════════════════════════ -->
</body>
</html>
