<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter CTA</title>
  <link rel="stylesheet" href="styles.min.css?v=1.0.0" />
</head>
<body>
  <!-- ═══ COPY FROM HERE ═══════════════════════════════════ -->
  <section class="newsletter-cta">
    <div class="container">
      <div class="newsletter-card">
        <h1>Stay in the loop with product updates</h1>
        <p>Join thousands of builders who get the latest feature launches and release notes straight to their inbox.</p>
        <form class="newsletter-form">
          <input type="email" placeholder="Enter your email" aria-label="Email address" />
          <button class="btn btn--primary" type="submit">Subscribe</button>
        </form>
        <p class="newsletter-hint">No spam. Unsubscribe anytime.</p>
      </div>
    </div>
  </section>
  <!-- ═══ COPY TO HERE ════════════════════════════ -->
</body>
</html>
