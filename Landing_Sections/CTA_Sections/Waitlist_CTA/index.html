<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waitlist CTA</title>
  <link rel="stylesheet" href="styles.min.css?v=1.0.0" />
</head>
<body>
  <!-- ═══ COPY FROM HERE ═══════════════════════════════════ -->
  <section class="waitlist-cta">
    <div class="container">
      <div class="waitlist-card">
        <div class="waitlist-hero">
          <span class="waitlist-eyebrow">Join the waitlist</span>
          <h1>Get early access before public launch</h1>
          <p>Be the first to try new collaboration tools, product insights, and premium support for your team.</p>
          <form class="waitlist-form">
            <input type="email" placeholder="you@example.com" aria-label="Email address" />
            <button class="btn btn--primary" type="submit">Reserve your spot</button>
          </form>
        </div>
        <div class="waitlist-meta">
          <div class="waitlist-meta-item"><h3>1,280+</h3><p>Teams waiting</p></div>
          <div class="waitlist-meta-item"><h3>24h</h3><p>Average onboarding</p></div>
          <div class="waitlist-meta-item"><h3>100%</h3><p>Early access perks</p></div>
        </div>
      </div>
    </div>
  </section>
  <!-- ═══ COPY TO HERE ════════════════════════════ -->
</body>
</html>
