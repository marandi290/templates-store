<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your account." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="favicon.ico" />
  <title>Login — Auth Templates</title>
  <link rel="stylesheet" href="styles.min.css?v=1.0.0" />
</head>
<body>

  <main class="auth-card">
    <a href="#" class="auth-logo">MyBrand</a>
    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-subheading">Sign in to your account to continue.</p>

    <form class="auth-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <div class="form-row">
        <label><input type="checkbox" /> Remember me</label>
        <a href="../Forgot_Password/index.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn-auth">Sign in</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="../Signup/index.html">Sign up</a></p>
  </main>

  <script>
    document.querySelector('.auth-form').addEventListener('submit', e => {
      e.preventDefault();
      alert('Login submitted. Wire up your backend here.');
    });
  </script>

</body>
</html>
