<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Set a new password for your account." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="favicon.ico" />
  <title>Reset Password — Auth Templates</title>
  <link rel="stylesheet" href="styles.min.css?v=1.0.0" />
</head>
<body>

  <main class="auth-card">
    <a href="#" class="auth-logo">MyBrand</a>
    <h1 class="auth-heading">Set new password</h1>
    <p class="auth-subheading">Your new password must be at least 8 characters.</p>

    <form class="auth-form" novalidate>
      <div class="form-group">
        <label for="password">New password</label>
        <input id="password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" required />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" placeholder="Repeat your password" autocomplete="new-password" required />
      </div>

      <button type="submit" class="btn-auth">Reset password</button>
    </form>

    <p class="auth-footer"><a href="../Login/index.html">← Back to sign in</a></p>
  </main>

  <script>
    document.querySelector('.auth-form').addEventListener('submit', e => {
      e.preventDefault();
      alert('Password reset. Wire up your backend here.');
    });
  </script>

</body>
</html>
