<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in with a magic link — no password needed." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="favicon.ico" />
  <title>Magic Link Login — Auth Templates</title>
  <link rel="stylesheet" href="styles.min.css?v=1.0.0" />
</head>
<body>

  <main class="auth-card">
    <a href="#" class="auth-logo">MyBrand</a>
    <h1 class="auth-heading">Sign in with a magic link</h1>
    <p class="auth-subheading">Enter your email and we'll send you a passwordless sign-in link.</p>

    <form class="auth-form" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
      </div>

      <button type="submit" class="btn-auth">Send magic link</button>
    </form>

    <div class="auth-divider">or</div>

    <p class="auth-footer">
      Prefer a password? <a href="../Login/index.html">Sign in with password</a>
    </p>
  </main>

  <script>
    document.querySelector('.auth-form').addEventListener('submit', e => {
      e.preventDefault();
      alert('Magic link sent. Wire up your backend here.');
    });
  </script>

</body>
</html>
