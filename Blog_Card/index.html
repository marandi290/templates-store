<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A responsive blog card built with HTML5 semantics and CSS Flexbox." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="favicon.ico" />
  <title>Blog Card</title>
  <link rel="stylesheet" href="styles.min.css?v=1.0.0" />
</head>
<body>

  <article class="blog-card">

    <figure class="blog-card__figure">
      <!-- Replace with your own image before deploying -->
      <img
        src="https://picsum.photos/seed/blog/600/400"
        alt="A scenic mountain landscape at sunrise"
        loading="lazy"
      />
    </figure>

    <div class="blog-card__body">
      <p class="blog-card__tag">Travel</p>

      <h3 class="blog-card__title">Exploring the Hidden Trails of the Dolomites</h3>

      <p class="blog-card__excerpt">
        Tucked away in northeastern Italy, the Dolomites offer some of the most
        breathtaking and underrated hiking trails in all of Europe. Here's what
        you need to know before you go.
      </p>

      <footer class="blog-card__footer">
        <div class="blog-card__author">
          <!-- Replace with your own avatar before deploying -->
          <img
            src="https://picsum.photos/seed/avatar/100/100"
            alt="Portrait of Alex Morgan"
          />
          <span>Alex Morgan</span>
        </div>
        <time datetime="2025-06-10">June 10, 2025</time>
      </footer>
    </div>

  </article>

</body>
</html>
